version: 2

sources:
  - name: raw
    description: Raw data from Python ingestion (PostgreSQL tables)
    schema: public
    tables:
      - name: customers
        description: Raw customer data from CSV
        columns:
          - name: customer_id
            description: Unique customer identifier
            tests:
              - unique
              - not_null
          - name: customer_name
            description: Customer full name
          - name: email
            description: Customer email address
          - name: phone
            description: Customer phone number
          - name: country
            description: Customer country

      - name: orders
        description: Raw order data from CSV
        columns:
          - name: order_id
            description: Unique order identifier
            tests:
              - unique
          - name: customer_id
            description: Foreign key to customers table
          - name: order_date
            description: Date when order was placed
          - name: amount
            description: Order amount in USD
          - name: status
            description: Order status (pending, completed, cancelled, etc.)
