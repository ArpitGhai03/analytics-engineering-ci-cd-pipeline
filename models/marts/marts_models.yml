version: 2

models:
  - name: customer_metrics
    description: Customer KPI metrics table with business intelligence
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - unique
          - not_null
      - name: customer_name
        description: Customer name
      - name: email
        description: Customer email
      - name: country
        description: Customer country
      - name: total_orders
        description: Total number of orders
        tests:
          - not_null
      - name: completed_orders
        description: Number of completed orders
        tests:
          - not_null
      - name: pending_orders
        description: Number of pending orders
      - name: total_revenue
        description: Total revenue from completed orders
        tests:
          - not_null
      - name: avg_order_value
        description: Average order value
      - name: last_order_date
        description: Most recent order date
      - name: customer_lifetime_value
        description: Customer lifetime value - revenue per day as customer
        tests:
          - not_null
      - name: customer_segment
        description: Customer value segment (High-Value, Medium-Value, Low-Value)
        tests:
          - not_null
          - accepted_values:
              values: ['High-Value', 'Medium-Value', 'Low-Value']
      - name: updated_at
        description: Timestamp of last update
