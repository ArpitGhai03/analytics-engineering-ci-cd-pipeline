version: 2

models:
  - name: stg_customers
    description: Cleaned customer data from raw source
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - unique
          - not_null
      - name: customer_name
        description: Customer name
        tests:
          - not_null
      - name: email
        description: Customer email
        tests:
          - unique
      - name: country
        description: Customer country

  - name: stg_orders
    description: Cleaned order data with validation
    columns:
      - name: order_id
        description: Unique order identifier
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to customer
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_date
        description: Date order was placed
        tests:
          - not_null
      - name: amount
        description: Order amount
        tests:
          - dbt_utils.accepted_values:
              values: [null]
              quote: false
      - name: status
        description: Order status
        tests:
          - accepted_values:
              values: ['completed', 'pending', 'cancelled']
