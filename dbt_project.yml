
# Name your project! Project names should be lowercase and use underscores as spaces.
name: 'dbt_project'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_project'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
data-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  dbt_project:
    staging:
      materialized: view
      tags: ['staging']
    marts:
      materialized: table
      tags: ['marts']

# Seed configuration
seeds:
  dbt_project:
    +quote_columns: false

# Variables
vars:
  start_date: '2026-01-01'

# Database quoting
quoting:
  identifier: false
  schema: false
